name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: github.actor != 'opencode-agent[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          # Exposed only so the agent can use the gh CLI (real review comments).
          # The action ignores it unless use_github_token is true; its scope is
          # limited to this job's permissions block above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: kilo/stealth/ox-alpha
          prompt: |
            Bug-focused code review of this pull request. Do not modify any files; your final response is posted automatically as a PR comment.

            Start your response with the exact line:
            > *This was generated by AI during triage.*

            Method:
            1. Read the PR diff and body. If it references an issue number, read that issue for its acceptance criteria.
            2. Diffs alone are not enough: read the full files touched, plus how existing code handles similar problems, before claiming anything doesn't fit.
            3. Review only the changed code. Pre-existing bugs outside the diff are not findings.
            4. Hunt specifically for: logic errors and broken guards; streaming/fold mistakes; races between subscriptions, optimistic updates, and out-of-order snapshots; mishandled daemon payloads; violations of CONTEXT.md domain rules (turn folding, pending sends, sealed reasoning); security issues in handling untrusted input (model- or daemon-controlled strings rendered as SVG/markdown, unbounded caches or loops); unintentional behavior changes.
            5. Be certain before you flag. Investigate first — execute the suspect path, simulate the reducer, or check the protocol package. If you cannot verify, either run a targeted experiment or omit the finding; never flag on suspicion alone.
            6. Run bun install (only if node_modules is absent) then bun test. Report the real pass/fail counts; failures are findings.

            For each finding, state the concrete scenario or inputs needed to trigger the bug, then a one-sentence fix. Post it as a REAL line-anchored review comment using the gh CLI (GITHUB_TOKEN is already set):

               gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments \
                 -f path=<file> -F line=<number of a line inside the diff> -f side=RIGHT \
                 -f "body=> *This was generated by AI during triage.*\n<severity>: <problem>. Trigger: <scenario>. Fix: <one sentence>."

               Anchor only to lines within the diff hunks. Findings without a stable anchor go in the summary instead.

            After posting anchored comments, submit the verdict:
               - any bug-severity findings: gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews -f event=REQUEST_CHANGES -f body="<one-paragraph summary>"
               - only minor findings: same call with event=COMMENT

            End your response with the numbered summary list (severity, file:line, problem). If nothing found, skip anchoring and the verdict, and reply exactly: "No bugs found."

            Never push code, never modify files, never close or merge anything.
