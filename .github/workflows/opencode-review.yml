name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: github.actor != 'opencode-agent[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          # Exposed only so the agent can use the gh CLI (real review comments).
          # The action ignores it unless use_github_token is true; its scope is
          # limited to this job's permissions block above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: kilo/stealth/ox-alpha
          prompt: |
            Bug-focused code review of this pull request. Do not modify any files; your final response is posted automatically as a PR comment.

            Start your response with the exact line:
            > *This was generated by AI during triage.*

            Then:
            1. Read the PR diff and body. If it references an issue number, read that issue for its acceptance criteria.
            2. Hunt for bugs only: logic errors, streaming/fold mistakes, races between subscriptions and optimistic updates, mishandled daemon payloads, violations of CONTEXT.md's domain rules (turn folding, pending sends, sealed reasoning). No style nits, no praise, no restating what the PR does.
            3. Run bun install (only if node_modules is absent) then bun test. Report the real pass/fail counts; failures are findings.
            4. For each finding, post a REAL line-anchored review comment using the gh CLI (GITHUB_TOKEN is already set in the environment):

               gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments \
                 -f path=<file> -F line=<line number in the new file version> -f side=RIGHT \
                 -f "body=> *This was generated by AI during triage.*\n<severity>: <one-sentence problem>. <one-sentence suggested fix>."

               Use the diff to pick correct line numbers; anchor to the changed line or its nearest hunk line. Skip a finding only if no stable anchor exists — keep those for the summary instead.

            5. After posting anchored comments, submit the review verdict:
               - any bug-severity findings: gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews -f event=REQUEST_CHANGES -f body="<one-paragraph summary>"
               - only minor findings: same call with event=COMMENT
            6. End your response with the numbered summary list (severity, file:line, problem, fix) as before. If nothing found, skip steps 4–5 and reply exactly: "No bugs found."

            Never push code, never modify files, never close or merge anything.
